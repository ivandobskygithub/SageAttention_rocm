[pytest]
# Pytest configuration for SageAttention3 ROCm tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes

# Markers
markers =
    gpu: Tests that require GPU
    slow: Slow-running tests
    accuracy: Numerical accuracy tests
    performance: Performance benchmark tests

# Coverage options (if pytest-cov is installed)
# addopts = --cov=sage_attention_rocm7 --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test_run.log
log_file_level = DEBUG

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
